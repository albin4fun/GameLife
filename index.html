<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f19">
  <meta name="description" content="Life RPG, ton tableau de bord de vie gamifié, personnel et disponible hors ligne.">
  <title>Life RPG</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <button class="rank-emblem rank-rune-1" id="rank-button" aria-label="Voir le classement"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 4 35 13 31 31 20 36 9 31 5 13Z"/><path d="m20 10 7 8-7 13-7-13Z"/></svg></button>
      <div class="xp-wrap">
        <div class="xp-track">
          <div class="xp-potential" id="xp-potential"></div><div class="xp-fill" id="xp-fill"></div>
          <span class="streak" id="streak"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.2 2.5c.7 4-3.7 5.1-2.4 8.4.6 1.4 1.8 1.6 2.5.5.7-1 .6-2.1.2-3.1 3.7 2.5 5.6 5.6 4.6 9.1-.9 3.1-3.4 5.1-7.1 5.1-4.1 0-7-2.8-7-6.8 0-3.4 2-6 5.2-8.7-.1 2.5.5 3.3 1.4 3.4C11 7.4 15 6 13.2 2.5Z"/></svg><span id="streak-count">0j</span></span>
          
        </div>
        <div class="xp-labels"><span id="xp-total">0 XP</span><span>Objectif</span><span id="xp-next">200 XP</span></div>
      </div>
      <span class="xp-star" aria-hidden="true">★</span>
    </header>

    <div class="rank-caption" id="rank-caption">BOIS · Novice</div>
    <section class="view" id="view" aria-live="polite"></section>

    <button class="quick-button" id="quick-button">⚡ Mise à jour</button>
    <nav class="bottom-nav" aria-label="Navigation principale">
      <button class="nav-button" data-tab="quests"><span><svg viewBox="0 0 24 24"><path d="M4 5h16v15H4zM8 3v4m8-4v4M4 10h16"/></svg></span><small>Quêtes</small></button>
      <button class="nav-button" data-tab="assistant"><span><svg viewBox="0 0 24 24"><path d="M5 19 4 5l8 6 8-6-1 14-7-5Z"/><path d="M9 14v2m6-2v2"/></svg></span><small>Assistant</small></button>
      <button class="nav-button active" data-tab="home"><span><svg viewBox="0 0 24 24"><path d="m3 11 9-7 9 7v9h-6v-6H9v6H3z"/></svg></span><small>Accueil</small></button>
      <button class="nav-button" data-tab="stats"><span><svg viewBox="0 0 24 24"><path d="M4 19V5m0 14h17M8 16l4-5 3 2 5-7"/></svg></span><small>Suivi</small></button>
      <button class="nav-button" data-tab="profile"><span><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3-7 8-7s8 3 8 7"/></svg></span><small>Profil</small></button>
      <i class="nav-dome" aria-hidden="true"></i>
    </nav>
  </main>

  <dialog id="modal" class="modal">
    <form method="dialog" class="modal-card" id="modal-content"></form>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
</body>
</html>
